components:
  schemas:
    UpdateZonesRequest:
      type: object
      properties:
        cityIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 20
          minItems: 0
        districtIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
          minItems: 0
      required:
        - cityIds
        - districtIds
    AgentProfileResponse:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        photoObjectKey:
          type: string
        zones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneResponse"
        acceptingAssignments:
          type: boolean
        completedVisitCount:
          type: integer
          format: int32
        averageRating:
          type: number
          format: double
        ratingCount:
          type: integer
          format: int32
        status:
          type: string
          enum:
            - PENDING
            - ACTIVE
            - SUSPENDED
            - DELETED
        profileComplete:
          type: boolean
        createdAt:
          type: string
          format: date-time
    ZoneResponse:
      type: object
      properties:
        cityId:
          type: string
          format: uuid
        districtId:
          type: string
          format: uuid
    AvailabilityRuleRequest:
      type: object
      properties:
        dayOfWeek:
          type: integer
          format: int32
          maximum: 7
          minimum: 1
        startTime:
          type: string
        endTime:
          type: string
      required:
        - dayOfWeek
        - endTime
        - startTime
    UpdateAvailabilityRequest:
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilityRuleRequest"
          maxItems: 30
          minItems: 0
        visitDurationMinutes:
          type: integer
          format: int32
          maximum: 480
          minimum: 15
      required:
        - rules
    AvailabilityResponse:
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilityRuleRequest"
        visitDurationMinutes:
          type: integer
          format: int32
        daysOff:
          type: array
          items:
            type: string
            format: date
    BookVisiteRequest:
      type: object
      properties:
        annonceId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
      required:
        - annonceId
        - startsAt
    VisiteResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        annonceId:
          type: string
          format: uuid
        annonceTitle:
          type: string
        agentAccountId:
          type: string
          format: uuid
        scheduledAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - SCHEDULED
            - CANCELLED
            - COMPLETED
        cancellationReason:
          type: string
          enum:
            - BY_USER
            - BY_AGENT
            - AGENT_UNAVAILABLE
            - AGENT_REMOVED
        createdAt:
          type: string
          format: date-time
    RateAgentRequest:
      type: object
      properties:
        rating:
          type: integer
          format: int32
          maximum: 5
          minimum: 1
      required:
        - rating
    SubscribeRequest:
      type: object
      properties:
        tier:
          type: string
          enum:
            - FREE
            - BASIC_PLUS
            - PRO
            - PRO_PLUS
        method:
          type: string
          enum:
            - MTN_MOMO
            - ORANGE_MONEY
      required:
        - method
        - tier
    PaymentInitiatedResponse:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
        providerRef:
          type: string
        amount:
          type: integer
          format: int32
        status:
          type: string
          enum:
            - PENDING
            - CONFIRMED
            - FAILED
            - CANCELLED
    PaymentWebhookRequest:
      type: object
      properties:
        providerRef:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - PENDING
            - CONFIRMED
            - FAILED
            - CANCELLED
        signature:
          type: string
          minLength: 1
      required:
        - providerRef
        - signature
        - status
    CreateSignalementRequest:
      type: object
      properties:
        targetType:
          type: string
          enum:
            - ANNONCE
            - MESSAGE
        targetId:
          type: string
          format: uuid
        reason:
          type: string
          enum:
            - FRAUDULENT_LISTING
            - ABNORMAL_PRICE
            - INAPPROPRIATE_CONTENT
            - HARASSMENT
        comment:
          type: string
          maxLength: 500
          minLength: 0
      required:
        - reason
        - targetId
        - targetType
    SignalementResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        targetType:
          type: string
          enum:
            - ANNONCE
            - MESSAGE
        targetId:
          type: string
          format: uuid
        reason:
          type: string
          enum:
            - FRAUDULENT_LISTING
            - ABNORMAL_PRICE
            - INAPPROPRIATE_CONTENT
            - HARASSMENT
        comment:
          type: string
        status:
          type: string
          enum:
            - PENDING
            - VALIDATED
            - REJECTED
        reporterAccountId:
          type: string
          format: uuid
        reporterSuspect:
          type: boolean
        targetValidatedCount:
          type: integer
          format: int64
        providerAlert:
          type: boolean
        reviewedBy:
          type: string
          format: uuid
        reviewedAt:
          type: string
          format: date-time
        reviewNote:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateResidenceRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
          minLength: 0
        districtId:
          type: string
          format: uuid
        exactAddress:
          type: string
          maxLength: 255
          minLength: 0
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
        availableFrom:
          type: string
          format: date
        description:
          type: string
          maxLength: 1500
          minLength: 0
        photoKeys:
          type: array
          items:
            type: string
            minLength: 1
          maxItems: 15
          minItems: 0
        units:
          type: array
          items:
            $ref: "#/components/schemas/UnitGroup"
          minItems: 1
      required:
        - availableFrom
        - districtId
        - exactAddress
        - latitude
        - longitude
        - name
        - units
    UnitGroup:
      type: object
      properties:
        propertyType:
          type: string
          enum:
            - APARTMENT
            - STUDIO
            - VILLA
            - ROOM
            - OFFICE
            - COMMERCIAL_SPACE
        count:
          type: integer
          format: int32
          maximum: 200
        namePrefix:
          type: string
          maxLength: 80
          minLength: 0
        price:
          type: integer
          format: int32
        rentalPeriod:
          type: string
          enum:
            - DAY
            - WEEK
            - MONTH
            - QUARTER
            - YEAR
        monthlyRent:
          type: integer
          format: int32
        chargesIncluded:
          type: boolean
        chargesAmount:
          type: integer
          format: int32
        surfaceArea:
          type: integer
          format: int32
        roomCount:
          type: integer
          format: int32
        bathroomCount:
          type: integer
          format: int32
        furnished:
          type: boolean
        description:
          type: string
          maxLength: 1500
          minLength: 0
      required:
        - count
        - namePrefix
        - propertyType
    ResidenceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        cityId:
          type: string
          format: uuid
        city:
          type: string
        districtId:
          type: string
          format: uuid
        district:
          type: string
        exactAddress:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        description:
          type: string
        photoKeys:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED
            - RESERVED
            - RENTED
            - ARCHIVED
        unitCount:
          type: integer
          format: int32
        publishedUnitCount:
          type: integer
          format: int32
        draftUnitCount:
          type: integer
          format: int32
        reserveUnitCount:
          type: integer
          format: int32
        units:
          type: array
          items:
            $ref: "#/components/schemas/UnitSummary"
        createdAt:
          type: string
          format: date-time
    UnitSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        propertyType:
          type: string
          enum:
            - APARTMENT
            - STUDIO
            - VILLA
            - ROOM
            - OFFICE
            - COMMERCIAL_SPACE
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED
            - RESERVED
            - RENTED
            - ARCHIVED
            - SUSPENDED
        price:
          type: integer
          format: int32
        rentalPeriod:
          type: string
          enum:
