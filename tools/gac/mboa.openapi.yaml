components:
  schemas:
    UsefulContactRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        role:
          type: string
          maxLength: 60
          minLength: 0
        phone:
          type: string
          minLength: 1
          pattern: "^\\+[1-9]\\d{7,14}$"
        serviceProviderId:
          type: string
          format: uuid
        shared:
          type: boolean
        annonceIds:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
      required:
        - name
        - phone
        - role
    UsefulContactResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
        phone:
          type: string
        serviceProviderId:
          type: string
          format: uuid
        shared:
          type: boolean
        annonceIds:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
    ServiceProviderPaymentRequest:
      type: object
      properties:
        amount:
          type: integer
          format: int64
          maximum: 100000000000
        paidOn:
          type: string
          format: date
        note:
          type: string
          maxLength: 500
          minLength: 0
        annonceId:
          type: string
          format: uuid
        residenceId:
          type: string
          format: uuid
      required:
