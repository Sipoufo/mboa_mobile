openapi: 3.0.3
info:
  title: Mboa API
  description: >
    The Mboa API surface, exported from the Spring Boot backend's
    `/v3/api-docs` and re-headed for this repo: the servers and the 3.0.3
    version line are ours, everything under `paths` and `components` is the
    backend's. `make gen-api` regenerates `packages/api_client` from it.

    Refresh it by re-exporting; never edit a path or a schema here to make the
    app compile, or the client will describe an API that does not exist.
  license:
    name: Proprietary
  version: v1
servers:
- url: https://api.mboa.cm/api/v1
  description: production
- url: https://staging.api.mboa.cm/api/v1
  description: staging
- url: http://localhost:8080/api/v1
  description: dev
security:
- bearerAuth: []
tags:
  - name: Historique
    description: Recently consulted listings
  - name: Annonces
    description: Create and manage the prestataire's listings
  - name: Admin — Mboa Score
    description: Inspect and adjust a user's Mboa Score
  - name: Search
    description: Public listing search
  - name: Finance — Ledger
    description: "Manual income and expenses, summary and CSV (M25)"
  - name: Assignation agent
    description: Assign an Agent Mboa to a listing
  - name: Password
    description: Change the account password
  - name: Residences
    description: Bulk-create and manage grouped listings
  - name: Badges
    description: Trust badges and photo verification
  - name: Visites — avis
    description: The client's review of a property they visited
  - name: Phone Change
    description: Change the account phone number with double OTP verification
  - name: Admin — utilisateurs
    description: Browse accounts and suspend them
  - name: Locations
    description: Country / region / city / district reference
  - name: Réservations (prestataire)
    description: Answer reservation requests within 48 h (M29)
  - name: Signalements
    description: "Report a listing, a message or a review"
  - name: Admin — KYC
    description: Review identity-verification submissions
  - name: Mon Logement
    description: "The home a signed Mboa Contract opens: its rent schedule — no payment\
    \ through Mboa, ever (M30)"
  - name: Messagerie
    description: Conversations between a user and a prestataire about a listing
  - name: Finance add-on
    description: The paid add-on that opens M24–M26 (RM-M13-09)
  - name: Admin — modération
    description: Review reports and moderate listings
  - name: Favoris
    description: Save listings and list what you saved
  - name: KYC
    description: Identity verification
  - name: Agent — assignations
    description: Offers an agent has received
  - name: Account
    description: Account-wide operations (any role)
  - name: Media
    description: Direct-to-R2 uploads via pre-signed URLs
  - name: Saved searches
    description: Up to three kept searches and their alerts (M04)
  - name: Agent — visites
    description: Visits assigned to the agent
  - name: Réservations
    description: "Ask to reserve a home — no payment, ever (M29)"
  - name: Current user
    description: The authenticated account's identity
  - name: Visites — présence
    description: Confirming presence on site
  - name: Admin — KPIs
    description: "Key figures, daily series and CSV export (M22)"
  - name: Prestataire Dashboard
    description: How the prestataire's listings are doing
  - name: Agent — candidatures
    description: Applications an agent has sent
  - name: Finance — Invoices (owner)
    description: Bill the tenant of a running Mboa contract (M24)
  - name: Subscriptions
    description: "Tiers, subscription and payment"
  - name: Admin — Subscriptions
    description: "Subscriptions, payments, grants, refunds, recap and plans (M21)"
  - name: Avis résident
    description: Review a property you actually lived in (M27)
  - name: Admin — annonces
    description: "Moderate listings: search, suspend, edit"
  - name: Admin — contrats
    description: Consult archived Mboa contracts (disputes)
  - name: Mboa Score
    description: The tenant reliability score
  - name: Quittances
    description: "Receipts of confirmed payments, and their public check (M30)"
  - name: Admin — badges
    description: "Validate, refuse and withdraw trust badges"
  - name: Assignation agent — résidence
    description: Assign an Agent Mboa to every unit at once
  - name: Admin — Type Change
    description: Review prestataire type-change requests
  - name: Prestataire Profile
    description: Profile of the App Mboa Pro service provider
  - name: Contrats
    description: "Mboa Contract — draw up, negotiate and sign a lease in-app"
  - name: Prestataire — visites
    description: Visits the owner carries out themselves
  - name: User Profile
    description: Personal profile of the App Mboa user
  - name: Visites
    description: Book a visit with an Agent Mboa
  - name: Invoices (tenant)
    description: What my landlord bills me (M24); paying it in the app is shut at the
      MVP
  - name: Agent
    description: "The agent's profile, intervention zones and availability"
  - name: Finance — Service providers
    description: "Intervenants and their payments, fed into the ledger (M26)"
  - name: User Settings
    description: "Language, notification and privacy preferences"
  - name: Authentication
    description: "Phone-OTP login, token refresh and logout"
  - name: Notification Devices
    description: Register device tokens for push notifications
paths:
  /api/v1/prestataires/me/contacts/{contactId}:
    put:
      tags:
        - Mon Logement
      summary: Replace a useful contact
      operationId: updateUsefulContact
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsefulContactRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UsefulContactResponse"
        "409":
          description: Conflicts with the current state — see the `error` code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid request or a violated business rule — see the `error`
            code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Missing, expired or invalid access token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authenticated but not allowed to perform this action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "The resource does not exist, or is not the caller's"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-mboa-roles:
        - PRESTATAIRE
      x-mboa-access: roles
    delete:
      tags:
        - Mon Logement
      summary: Remove a useful contact
      operationId: deleteUsefulContact
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content
        "409":
          description: Conflicts with the current state — see the `error` code
