      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateZonesRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AgentProfileResponse"
        "404":
          description: "The resource does not exist, or is not the caller's"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authenticated but not allowed to perform this action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Missing, expired or invalid access token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid request or a violated business rule — see the `error`
            code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflicts with the current state — see the `error` code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
