name: mboa_user
description: App Mboa — general public (tenants, buyers, sellers).
version: 1.0.0+1
publish_to: none

resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  mboa_core:
    path: ../../packages/mboa_core
  mboa_ui:
    path: ../../packages/mboa_ui
  mboa_l10n:
    path: ../../packages/mboa_l10n
  mboa_shared:
    path: ../../packages/mboa_shared

  flutter_bloc: ^9.0.0
  bloc: ^9.0.0
  equatable: ^2.0.0
  get_it: ^8.0.0
  auto_route: ^9.2.2
  intl: ^0.20.2
  # Builders for the generated query parameters (M04's multi-select filters).
  built_collection: '>=5.1.1 <6.0.0'
  # CE-M05-01 reads the status code off a DioException: a deleted listing is a
  # different screen from an unreachable server.
  dio: ^5.7.0
  cached_network_image: ^3.4.1
  lucide_icons_flutter: ^3.1.10
  sentry_flutter: ^9.0.0
  firebase_core: ^3.8.0 # FCM init (M03)
  firebase_messaging: ^15.1.5 # background handler registration
  maplibre_gl: ^0.27.1
  # RM-M07bis-06 — the report as a printable PDF, handed to the share sheet.
  path_provider: ^2.1.4
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  auto_route_generator: ^9.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

# Native (OS-level) splash shown before Flutter boots.
#
# **Regenerate with `make brand-assets`, never with the tool alone.**
# `flutter_native_splash` does not honour `background_image` on iOS or
# Android — it writes a 1x1 colour swatch and stretches it — so running
# `dart run flutter_native_splash:create` by itself flattens the wallpaper to
# plain green. The Makefile target runs the tool for the storyboard, the
# Android 12 style and the plumbing, then lays the real artwork back over it.
#
# Vert Forêt strewn with small monograms, the white logotype centred — the
# same picture as `MboaSplashView`, which replaces it a frame later, so the
# hand-off is invisible. Both images come from scripts/brand/make_assets.py;
# restyle there, not here.
flutter_native_splash:
  color: "#1A5C45"
  color_dark: "#0F3829"
  image: assets/splash/splash_logo.png
  image_dark: assets/splash/splash_logo.png
  android_12:
    # Android 12+ draws its own circle from the launcher icon, so it takes the
    # monogram rather than the logotype.
    image: assets/splash/splash_logo.png
    image_dark: assets/splash/splash_logo.png
    color: "#1A5C45"
    color_dark: "#0F3829"
  android: true
  ios: true
  web: false
