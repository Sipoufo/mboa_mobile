name: mboa_user
description: App Mboa — general public (tenants, buyers, sellers).
version: 1.0.0+1
publish_to: none

resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  mboa_core:
    path: ../../packages/mboa_core
  mboa_ui:
    path: ../../packages/mboa_ui
  mboa_shared:
    path: ../../packages/mboa_shared

  flutter_bloc: ^9.0.0
  bloc: ^9.0.0
  equatable: ^2.0.0
  get_it: ^8.0.0
  auto_route: ^9.2.2
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  sentry_flutter: ^8.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  auto_route_generator: ^9.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
