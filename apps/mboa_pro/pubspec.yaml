name: mboa_pro
description: App Mboa Pro — service providers & agents.
version: 1.0.0+1
publish_to: none

resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  mboa_core:
    path: ../../packages/mboa_core
  mboa_ui:
    path: ../../packages/mboa_ui
  mboa_l10n:
    path: ../../packages/mboa_l10n
  mboa_shared:
    path: ../../packages/mboa_shared

  flutter_bloc: ^9.0.0
  bloc: ^9.0.0
  equatable: ^2.0.0
  get_it: ^8.0.0
  auto_route: ^9.2.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  auto_route_generator: ^9.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

# Native (OS-level) splash shown before Flutter boots. Regenerate native assets
# with: dart run flutter_native_splash:create
# Background matches MboaSplashView's surface for a seamless hand-off to the
# Flutter splash. Restyle here, then re-run create.
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#111417"
  image: assets/splash/splash_logo.png
  image_dark: assets/splash/splash_logo_dark.png
  android_12:
    image: assets/splash/splash_logo.png
    image_dark: assets/splash/splash_logo_dark.png
    color: "#FFFFFF"
    color_dark: "#111417"
  android: true
  ios: true
  web: false
