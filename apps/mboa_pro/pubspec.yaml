name: mboa_pro
description: App Mboa Pro — service providers & agents.
version: 1.0.0+1
publish_to: none

resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  mboa_core:
    path: ../../packages/mboa_core
  mboa_ui:
    path: ../../packages/mboa_ui
  mboa_l10n:
    path: ../../packages/mboa_l10n
  mboa_shared:
    path: ../../packages/mboa_shared

  flutter_bloc: ^9.0.0
  bloc: ^9.0.0
  equatable: ^2.0.0
  get_it: ^8.0.0
  auto_route: ^9.2.2
  intl: ^0.20.2
  lucide_icons_flutter: ^3.1.10
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  dio: ^5.7.0 # bare client for direct PUTs to R2 presigned URLs
  firebase_core: ^3.8.0 # FCM init (M03)
  firebase_messaging: ^15.1.5 # background handler registration
  # Builders for the generated request DTOs (ListBuilder on photoKeys/units).
  built_collection: '>=5.1.1 <6.0.0'
  # GPS for the listing location step (M10); also the agents' 500m check (M15).
  geolocator: ^13.0.2
  # Reverse-geocodes the GPS fix to a city name, so the district list can be
  # narrowed automatically instead of making the user find their city.
  geocoding: ^3.0.0
  # RM-M07bis-06 — the visit review's PDF is bytes, not a URL: it is written to
  # a cache file and handed to the OS, which is where printing and saving live
  # on a phone. Neither package needs a runtime permission.
  path_provider: ^2.1.4
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  auto_route_generator: ^9.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_native_splash: ^2.4.4
  # Test-only: assert what the generated client is handed (visit_range_test).
  api_client:
    path: ../../packages/api_client
  built_value: ^8.9.0

flutter:
  uses-material-design: true

# Native (OS-level) splash shown before Flutter boots. Regenerate native assets
# with: dart run flutter_native_splash:create
# Background is Vert Forêt Foncé (#0F3829, MboaColors.primaryDark) with the white
# logo, matching MboaSplashView for a seamless hand-off. Restyle here, then
# re-run create.
flutter_native_splash:
  color: "#0F3829"
  color_dark: "#0F3829"
  image: assets/splash/splash_logo.png
  image_dark: assets/splash/splash_logo.png
  android_12:
    image: assets/splash/splash_logo.png
    image_dark: assets/splash/splash_logo.png
    color: "#0F3829"
    color_dark: "#0F3829"
  android: true
  ios: true
  web: false
