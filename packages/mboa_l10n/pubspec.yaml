name: mboa_l10n
description: Shared localisation for the Mboa apps — ARB sources + generated I18n (intl_utils).
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_lints: ^6.0.0
  intl_utils: ^2.8.10

# intl_utils (Localizely "Flutter Intl") config — regenerate with:
#   make gen-l10n   (dart run intl_utils:generate)
flutter_intl:
  enabled: true
  class_name: I18n
  main_locale: fr
  arb_dir: lib/l10n
  output_dir: lib/generated

flutter:
  generate: false
