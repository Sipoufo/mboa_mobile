name: api_client
version: 1.0.0
description: Generated Mboa API client (openapi-generator, dart-dio). Do not edit lib/ by hand — run `make gen-api`.
publish_to: none

# Workspace member — resolves against the root shared lockfile.
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  dio: ^5.7.0
  one_of: '>=1.5.0 <2.0.0'
  one_of_serializer: '>=1.5.0 <2.0.0'
  built_value: '>=8.4.0 <9.0.0'
  built_collection: '>=5.1.1 <6.0.0'

dev_dependencies:
  built_value_generator: '>=8.4.0 <9.0.0'
  build_runner: any
  test: ^1.16.0
