name: mboa_shared
description: Features shared identically by both Mboa apps (e.g. the login flow).
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter

  mboa_core:
    path: ../mboa_core
  mboa_ui:
    path: ../mboa_ui
  mboa_l10n:
    path: ../mboa_l10n

  flutter_bloc: ^9.0.0
  bloc: ^9.0.0
  equatable: ^2.0.0
  get_it: ^8.0.0
  # Route guards shared by both apps (the route tables stay app-local).
  auto_route: ^9.2.2
  # SessionRepository inspects DioException types for offline-aware validation;
  # MediaUploader also uses a bare Dio for direct PUTs to R2 presigned URLs.
  dio: ^5.7.0
  # Media capture + compression for the shared MediaUploader (KYC docs, photos).
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  # Icons used by shared media widgets (capture-source sheet).
  lucide_icons_flutter: ^3.1.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  # Test-only: build DTOs (hidden from the mboa_core barrel) to stub responses.
  api_client:
    path: ../api_client
  built_collection: '>=5.1.1 <6.0.0'
