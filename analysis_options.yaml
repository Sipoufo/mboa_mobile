# Shared, strict analyzer config inherited by every package in the workspace.
# CLAUDE.md rule: never disable `flutter analyze` to pass a build — fix warnings.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - "**.g.dart"
    - "**.gr.dart"        # auto_route generated
    - "**.freezed.dart"
    - "**.config.dart"
    - "packages/api_client/**"   # openapi-generator output
    - "**/l10n/**"
    - "**/generated/**"          # intl_utils output (mboa_l10n)
  errors:
    invalid_annotation_target: ignore
    # Treat these as build-breaking to keep the tree honest.
    always_declare_return_types: error
    avoid_relative_lib_imports: error

linter:
  rules:
    avoid_print: true
    prefer_single_quotes: true
    use_super_parameters: true
    always_declare_return_types: true
    avoid_annotating_with_dynamic: true
    avoid_relative_lib_imports: true
    require_trailing_commas: true
    prefer_const_constructors: true
    prefer_final_locals: true
    unawaited_futures: true
    sort_child_properties_last: true

formatter:
  page_width: 120
  trailing_commas: preserve
